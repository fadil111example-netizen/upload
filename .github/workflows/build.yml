name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'ci-logs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # PENYEBAB KEGAGALAN run #1/#2: setup-android@v3 meminta paket 'tools'
      # yang sudah dihapus Google, sehingga langkah ini GAGAL dan langkah build
      # ikut di-skip (build-full.log tidak pernah dibuat).
      # v4 memperbaikinya: default-nya hanya 'platform-tools'.
      - name: Set up Android SDK
        id: sdk
        continue-on-error: true
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Cadangan bila setup-android masih gagal: pasang command-line tools manual,
      # lalu paket yang dibutuhkan AGP.
      - name: Pasang paket Android SDK (cadangan)
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan di PATH -> memasang command-line tools manual."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            rm -rf "$SDK_ROOT/cmdline-tools/ct" "$SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            unzip -q -o /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools/ct"
            mv "$SDK_ROOT/cmdline-tools/ct/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            export ANDROID_HOME="$SDK_ROOT"
            export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
            echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tetap tidak ditemukan setelah pemasangan manual."
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || "$SDKMANAGER" "platforms;android-35"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --full-stacktrace 2>&1 | tee ci-logs/build-full.log
          code=${PIPESTATUS[0]}
          echo "gradle_exit=$code"
          # Teruskan exit code Gradle. Dengan continue-on-error, job tetap lanjut
          # mengumpulkan log, tapi steps.build.outcome jadi 'failure' dengan benar.
          exit $code

      - name: Kumpulkan log & error penting
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "== Informasi lingkungan =="
            uname -a
            java -version 2>&1 || true
            echo "---- gradle --version ----"
            gradle --version 2>&1 || true
            echo "---- sdkmanager --list_installed ----"
            sdkmanager --list_installed 2>&1 | tail -40 || true
            echo "---- setup-android outcome ----"
            echo "steps.sdk.outcome = ${{ steps.sdk.outcome }}"
            echo "ANDROID_HOME=${ANDROID_HOME:-<kosong>}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<kosong>}"
          } > ci-logs/environment.txt

          # Ambil baris error compiler Kotlin/Java + penyebab Gradle.
          if [ ! -f ci-logs/build-full.log ]; then
            echo "build-full.log tidak ada: langkah 'Build debug APK' tidak berjalan." \
              "(biasanya karena langkah setup SDK/Gradle gagal lebih dulu)." > ci-logs/build-errors.txt
          else
            grep -nE '^(e|w): |^> Task .*FAILED|FAILURE: Build failed|error: |Could not (resolve|find|determine)|Execution failed for task|Caused by:|What went wrong|Unresolved reference|Compilation error' \
              ci-logs/build-full.log > ci-logs/build-errors.txt 2>/dev/null || true
            echo "(kosong = tidak ada baris error yang cocok)" >> ci-logs/build-errors.txt
          fi

          tail -n 120 ci-logs/build-full.log > ci-logs/build-tail.txt 2>/dev/null || true
          ls -la ci-logs

      - name: Ringkasan di halaman Actions
        if: always()
        shell: bash
        run: |
          {
            echo "## Hasil build : ${{ steps.build.outcome }}"
            echo ""
            echo "- setup-android: \`${{ steps.sdk.outcome }}\`"
            echo "- build: \`${{ steps.build.outcome }}\`"
            echo ""
            echo '```'
            head -n 60 ci-logs/build-errors.txt 2>/dev/null || echo "(belum ada ci-logs/build-errors.txt)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK (bila berhasil)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: upload-github-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Log selalu diupload (berhasil maupun gagal) supaya bisa dibaca/diunduh.
      - name: Upload log build (selalu)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci-logs/*
          if-no-files-found: warn
          retention-days: 30

      - name: Komentar log di Pull Request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ERRORS_FILE: ci-logs/build-errors.txt
        with:
          script: |
            const fs = require('fs');
            let body = '### Hasil build: `${{ steps.build.outcome }}`\n\n';
            try {
              const errors = fs.readFileSync(process.env.ERRORS_FILE, 'utf8').trim();
              body += '```text\n' + errors.slice(0, 6000) + '\n```\n\n';
            } catch (e) {
              body += '_Tidak ada ringkasan error._\n\n';
            }
            body += 'Log lengkap: unduh artifact **build-logs** pada halaman run ini.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # Hanya untuk push / manual (PR dari fork tidak punya izin tulis).
      - name: Commit log ke cabang ci-logs/ (bila gagal)
        if: steps.build.outcome == 'failure' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'ci: log build gagal [skip ci]'
          file_pattern: 'ci-logs/*.txt ci-logs/*.log'
          # ci-logs/ ada di .gitignore, jadi harus di-force.
          add_options: '-f'
          branch: 'ci-logs/log-${{ github.run_number }}'
          create_branch: true

      - name: Tandai job gagal
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build gagal. Lihat artifact 'build-logs' untuk log lengkap."
          exit 1